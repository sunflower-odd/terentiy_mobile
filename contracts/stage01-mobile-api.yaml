openapi: 3.1.0
info:
  title: Terentiy Mobile Server API
  version: 1.0.0
  description: |
    HTTP contract for a Terentiy mobile application and the server.

    It deliberately contains only mobile-facing endpoints: device activation and
    login, agent health, fall events, and evidence downloads. Agent-to-server
    endpoints are documented separately in `terentiy-api.openapi.yaml`.
servers:
  - url: http://127.0.0.1:8080
    description: Local development or a server reachable through a LAN address.
tags:
  - name: Diagnostics
    description: Server availability check.
  - name: Authentication
    description: Mobile device activation and authentication.
  - name: Agents
    description: Edge-agent health visible to the mobile household.
  - name: Events
    description: Confirmed falls and their evidence.
paths:
  /health:
    get:
      tags: [Diagnostics]
      summary: Check API and PostgreSQL availability
      operationId: health
      responses:
        '200':
          description: API and PostgreSQL are available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: ok
                database: ok
        '503':
          description: API is running, but PostgreSQL is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: degraded
                database: unavailable

  /api/v1/mobile/activate:
    post:
      tags: [Authentication]
      summary: Activate a mobile device
      description: |
        Registers a new mobile device in the household selected by an
        installation code and returns a bearer token. A device ID can be
        activated only once; use login after the first successful activation.
      operationId: activateMobile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileActivationRequest'
            example:
              installation_code: HOME-SETUP-CODE
              device_id: android-7f3a3b15
              pin: '123456'
      responses:
        '201':
          description: Device activated and a bearer token issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileToken'
        '401':
          $ref: '#/components/responses/ServiceError'
        '409':
          $ref: '#/components/responses/ServiceError'
        '422':
          $ref: '#/components/responses/InvalidRequest'

  /api/v1/mobile/login:
    post:
      tags: [Authentication]
      summary: Log in an activated mobile device
      description: |
        Exchanges a previously activated device ID and its six-digit PIN for a
        new bearer token. The PIN is never returned by the API.
      operationId: loginMobile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileLoginRequest'
            example:
              device_id: android-7f3a3b15
              pin: '123456'
      responses:
        '200':
          description: New bearer token issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileToken'
        '401':
          $ref: '#/components/responses/ServiceError'
        '422':
          $ref: '#/components/responses/InvalidRequest'

  /api/v1/agents:
    get:
      tags: [Agents]
      summary: List household agents and their latest health status
      description: |
        Returns only agents belonging to the authenticated mobile device's
        household. Status fields are `null` until an agent has sent its first
        heartbeat.
      operationId: listAgents
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Household agents and their latest health status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentList'
        '401':
          $ref: '#/components/responses/ServiceError'

  /api/v1/events:
    get:
      tags: [Events]
      summary: List confirmed fall events
      description: |
        Returns only complete events from the authenticated mobile device's
        household, ordered from newest to oldest. Each event has downloadable
        JPEG frame and MP4 clip evidence.
      operationId: listFallEvents
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AgentIdFilter'
      responses:
        '200':
          description: Confirmed fall events visible to the mobile device.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FallEventList'
        '401':
          $ref: '#/components/responses/ServiceError'

  /api/v1/media/{media_id}:
    get:
      tags: [Events]
      summary: Download event evidence
      description: |
        Downloads JPEG frame or MP4 clip evidence when it belongs to the
        authenticated mobile device's household. Use `clip_media_id` from a
        fall event to download its clip.
      operationId: downloadMedia
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MediaId'
      responses:
        '200':
          description: Binary media. Inspect the `Content-Type` response header.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            video/mp4:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/ServiceError'
        '404':
          $ref: '#/components/responses/ServiceError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Mobile access token returned by activation or login.

  parameters:
    AgentIdFilter:
      name: agent_id
      in: query
      required: false
      description: Return events for one agent only.
      schema:
        type: string
        format: uuid
    MediaId:
      name: media_id
      in: path
      required: true
      description: Identifier of a JPEG frame or MP4 clip.
      schema:
        type: string
        format: uuid

  responses:
    ServiceError:
      description: Stable application error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InvalidRequest:
      description: Request body is malformed or violates a business validation rule.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/Error'
              - $ref: '#/components/schemas/RequestValidationError'

  schemas:
    Health:
      type: object
      required: [status, database]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        database:
          type: string
          enum: [ok, unavailable]

    MobileActivationRequest:
      type: object
      required: [installation_code, device_id, pin]
      properties:
        installation_code:
          type: string
          description: Installation code provisioned on the server.
        device_id:
          type: string
          minLength: 1
          description: Stable device-generated identifier, unique within the server.
        pin:
          type: string
          pattern: '^\d{6}$'
          description: Six decimal digits selected during activation.

    MobileLoginRequest:
      type: object
      required: [device_id, pin]
      properties:
        device_id:
          type: string
          description: Device ID used during activation.
        pin:
          type: string
          pattern: '^\d{6}$'
          description: Six-digit PIN chosen during activation.

    MobileToken:
      type: object
      required: [access_token, token_type, household_id]
      properties:
        access_token:
          type: string
          description: "Opaque token; send it as `Authorization: Bearer <token>`."
        token_type:
          type: string
          const: bearer
        household_id:
          type: string
          description: Stable identifier of the household selected by the installation code.

    AgentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Agent'

    Agent:
      type: object
      required:
        - id
        - household_id
        - name
        - camera_id
        - software_version
        - created_at
        - reported_at
        - agent_online
        - camera_connected
        - stream_active
        - queue_size
        - last_frame_at
        - online
      properties:
        id:
          type: string
          format: uuid
        household_id:
          type: string
        name:
          type: string
        camera_id:
          type: string
        software_version:
          type: string
        created_at:
          type: string
          format: date-time
        reported_at:
          type: [string, 'null']
          format: date-time
          description: Timestamp of the last agent heartbeat.
        agent_online:
          type: [boolean, 'null']
          description: Value reported by the agent in its last heartbeat.
        camera_connected:
          type: [boolean, 'null']
          description: Value reported by the agent in its last heartbeat.
        stream_active:
          type: [boolean, 'null']
          description: Value reported by the agent in its last heartbeat.
        queue_size:
          type: [integer, 'null']
          minimum: 0
          description: Frames waiting locally on the agent at its last heartbeat.
        last_frame_at:
          type: [string, 'null']
          format: date-time
        online:
          type: boolean
          description: |
            True only when the last heartbeat reports `agent_online = true` and
            it is still fresh according to the server's offline timeout.

    FallEventList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FallEvent'

    FallEvent:
      type: object
      required:
        - id
        - agent_id
        - frame_id
        - frame_media_id
        - captured_at
        - status
        - analysis
        - clip_media_id
        - created_at
      properties:
        id:
          type: string
          format: uuid
        agent_id:
          type: string
          format: uuid
        frame_id:
          type: string
          format: uuid
        frame_media_id:
          type: string
          format: uuid
          description: JPEG frame identifier for immediate display or download.
        captured_at:
          type: string
          format: date-time
          description: Timestamp of the frame that produced the confirmed fall.
        status:
          type: string
          enum: [confirmed]
        analysis:
          type: object
          additionalProperties: true
          description: ML and fall-rule result recorded by the server.
        clip_media_id:
          type: string
          format: uuid
          description: MP4 clip identifier, always available for listed events.
        created_at:
          type: string
          format: date-time

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable application error code.
        message:
          type: string
          description: Human-readable error explanation.

    RequestValidationError:
      type: object
      required: [detail]
      properties:
        detail:
          type: array
          items:
            type: object
            required: [loc, msg, type]
            properties:
              loc:
                type: array
                items:
                  type: [string, integer]
              msg:
                type: string
              type:
                type: string
            additionalProperties: true
