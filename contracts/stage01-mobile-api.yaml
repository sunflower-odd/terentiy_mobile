# ВНИМАНИЕ: синхронизированная копия. Оригинал принадлежит репозиторию terentiy_ai.
# Источник: terentiy_ai/contracts/openapi/mobile-server.openapi.yaml
# Коммит источника: 6bc7243 (2026-11-04) + PR «зоны: переключатель и правила
# тревоги» (не слит), версия 2.0.0-draft.
# Синхронизировано: 2026-11-05
# Правки вносятся в terentiy_ai и переносятся сюда целиком, а не наоборот.
#
# Черновик описывает /health, вход и зоны. Маршруты падений (/api/v1/events и
# др.) в нём не перечислены, но на сервере работают как в 1.0.0 — приложение
# их использует без изменений.
#
# Расхождения с сервером:
# - /health описан как ok/degraded с checked_at и issues; сервер пока отдаёт
#   прежний ответ {status, database}. Приложение работает по прежнему.
# - reference_frame_id при создании и перерисовке зоны должен быть текущим
#   кадром камеры — не старше server.agent_offline_after_seconds (30 с), иначе
#   422 invalid_reference_frame. В контракте этого нет.
# - PUT …/zones/{zone_id} приложение не использует: правка зоны — PATCH.

openapi: 3.1.0
info:
  title: API сервера для мобильного приложения Терентия
  version: 2.0.0-draft
  description: |
    Первый этап критических зон: пользователь размечает площадку пола перед
    дверью, а сервер подтверждает, что на свежих кадрах действительно видит
    опорную точку человека внутри площадки.

    Сервер является единственным источником истины для оценки позы, опорной точки,
    попадания в полигон и результата привязки. Мобильное приложение только
    рисует контур и показывает возвращённый маркер. Периферийный агент продолжает
    публиковать кадры по своему существующему протоколу; этот контракт его не
    изменяет.
servers:
  - url: http://127.0.0.1:8080
    description: Локальная разработка или сервер в домашней сети.
tags:
  - name: Diagnostics
    description: Диагностика
  - name: Authentication
    description: Аутентификация
  - name: Agents
    description: Агенты и камеры
  - name: Zones
    description: Зоны
  - name: Media
    description: Медиафайлы
paths:
  /health:
    get:
      tags: [Diagnostics]
      summary: Получить общую готовность наблюдения
      description: |
        Авторизация не требуется. Сервер проверяет БД, медиахранилище,
        готовность worker, размер очереди обработки и доступность камер.
        Проверка охватывает всех зарегистрированных агентов без раскрытия их идентификаторов.

        Фоновый монитор выполняет цикл не реже раза в 5 секунд независимо
        от запросов клиента. Проверки БД и хранилища ограничены по времени.
        Хотя бы один worker должен загрузить модели и подтвердить готовность
        за последние 15 секунд, даже при пустой очереди обработки.
        Готовность worker передаётся независимо от получения задач и lease агента.

        processing_delayed возникает, когда общее число задач ML в состояниях
        queued и running превышает серверный лимит очереди N. Задачи completed
        и failed не учитываются. Причина снимается, когда число задач не больше N.
        N — неотрицательное целое число, заданное на сервере. Клиент
        не вычисляет задержку и не оценивает время обработки.

        У каждого зарегистрированного агента должен быть свежий heartbeat
        в пределах заданного на сервере срока; agent_online, camera_connected
        и stream_active должны быть true. Иначе возвращается camera_unavailable.
        Эти поля и last_frame_at поступают по существующему протоколу статуса
        агента. Клиент не выполняет дополнительных проверок устройства и камеры.

        Полный цикл мониторинга не старше 15 секунд позволяет вернуть HTTP 200:
        ok, если все проверки успешны; degraded, если есть хотя бы одна проблема.
        checked_at — время завершения цикла, а не время HTTP-запроса.
        До завершения первого цикла, при результате старше 15 секунд
        или невозможности определить состояние возвращается HTTP 503.
        Непредвиденная внутренняя ошибка возвращается как HTTP 500.
        Устаревший ok нельзя выдавать как актуальный.
        Все ответы проверки состояния запрещено кешировать (Cache-Control: no-store).

        На главном экране клиент опрашивает сервер раз в 5 секунд с таймаутом
        5 секунд и обновляет состояние после возвращения в приложение.
        Только корректный HTTP 200 со статусом ok подтверждает работу наблюдения.
        degraded, код кроме 200, сетевая ошибка, таймаут или некорректное тело
        ответа означают недоступность. Без нового успешного опроса результат
        не подтверждает готовность спустя 15 секунд.
      operationId: health
      security: []
      responses:
        '200':
          description: Готовность наблюдения определена.
          headers:
            Cache-Control:
              description: Результаты проверки состояния запрещено кешировать.
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
              examples:
                operational:
                  value:
                    status: ok
                    checked_at: '2026-10-26T12:00:00Z'
                    issues: []
                processingUnavailable:
                  value:
                    status: degraded
                    checked_at: '2026-10-26T12:00:00Z'
                    issues: [processing_unavailable]
                processingDelayed:
                  value:
                    status: degraded
                    checked_at: '2026-10-26T12:00:00Z'
                    issues: [processing_delayed]
                cameraUnavailable:
                  value:
                    status: degraded
                    checked_at: '2026-10-26T12:00:00Z'
                    issues: [camera_unavailable]
        '503':
          description: Состояние наблюдения не определено; мониторинг запускается, устарел или недоступен.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                monitoringUnavailable:
                  value:
                    code: health_unavailable
                    message: Невозможно определить состояние наблюдения.
        '500':
          description: Непредвиденная внутренняя ошибка.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/mobile/activate:
    post:
      tags: [Authentication]
      summary: Активировать мобильное устройство в домохозяйстве
      operationId: activateMobile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MobileActivationRequest' }
      responses:
        '201':
          description: Устройство активировано, токен доступа выдан.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MobileToken' }
        '401': { $ref: '#/components/responses/ServiceError' }
        '409': { $ref: '#/components/responses/ServiceError' }
        '422': { $ref: '#/components/responses/ServiceError' }

  /api/v1/mobile/login:
    post:
      tags: [Authentication]
      summary: Выполнить вход с активированного мобильного устройства
      operationId: loginMobile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MobileLoginRequest' }
      responses:
        '200':
          description: Токен доступа выдан.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MobileToken' }
        '401': { $ref: '#/components/responses/ServiceError' }
        '422': { $ref: '#/components/responses/ServiceError' }

  /api/v1/agents:
    get:
      tags: [Agents]
      summary: Получить список камер домохозяйства
      operationId: listAgents
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Агенты домохозяйства.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentList' }
        '401': { $ref: '#/components/responses/ServiceError' }

  /api/v1/agents/{agent_id}/cameras/{camera_id}/current-frame:
    get:
      tags: [Agents]
      summary: Получить последний кадр камеры для разметки или проверки зоны
      description: |
        Возвращённый frame_id неизменяем. Его необходимо передать как
        reference_frame_id при создании или перерисовке зоны.
        JPEG загружается через GET /api/v1/media/{media_id}.
      operationId: getCurrentFrame
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/AgentId'
        - $ref: '#/components/parameters/CameraId'
      responses:
        '200':
          description: Метаданные последнего кадра.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentFrame' }
        '401': { $ref: '#/components/responses/ServiceError' }
        '404':
          description: agent_not_found или camera_unavailable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/agents/{agent_id}/cameras/{camera_id}/zones:
    get:
      tags: [Zones]
      summary: Получить список зон перед дверью
      operationId: listZones
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/AgentId'
        - $ref: '#/components/parameters/CameraId'
      responses:
        '200':
          description: Зоны камеры и состояние их привязки.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ZoneList' }
        '401': { $ref: '#/components/responses/ServiceError' }
        '404': { $ref: '#/components/responses/ServiceError' }
    post:
      tags: [Zones]
      summary: Создать зону перед дверью без привязки
      description: |
        Создаёт полигон на полу, его опорный кадр, переключатель и условия
        тревоги. Новая зона имеет состояние draft и не даёт результатов
        наблюдения до перехода сессии привязки в bound. Полигон задан
        в нормализованных координатах reference_frame_id. Без enabled зона
        включена; без rules получает одно правило: тревога при входе, всегда.
      operationId: createZone
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/AgentId'
        - $ref: '#/components/parameters/CameraId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ZoneRequest' }
      responses:
        '201':
          description: Создан черновик зоны с версией 1.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Zone' }
        '401': { $ref: '#/components/responses/ServiceError' }
        '404': { $ref: '#/components/responses/ServiceError' }
        '422':
          description: invalid_zone, invalid_reference_frame или zone_limit_reached.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/agents/{agent_id}/cameras/{camera_id}/zones/{zone_id}:
    get:
      tags: [Zones]
      summary: Получить зону перед дверью
      operationId: getZone
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/AgentId'
        - $ref: '#/components/parameters/CameraId'
        - $ref: '#/components/parameters/ZoneId'
      responses:
        '200':
          description: Текущее состояние зоны.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Zone' }
        '401': { $ref: '#/components/responses/ServiceError' }
        '404': { $ref: '#/components/responses/ServiceError' }
    put:
      tags: [Zones]
      summary: Заменить разметку зоны перед дверью
      description: |
        Полная перерисовка. Требуется текущая версия. Изменение полигона или
        опорного кадра аннулирует привязку и переводит зону в draft; затем
        клиент запускает новую сессию привязки. Переключатель и правила этим
        методом не меняются — для них и для частичной правки служит PATCH.
      operationId: updateZone
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/AgentId'
        - $ref: '#/components/parameters/CameraId'
        - $ref: '#/components/parameters/ZoneId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ZoneUpdateRequest' }
      responses:
        '200':
          description: Разметка зоны заменена, прежняя привязка аннулирована.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Zone' }
        '401': { $ref: '#/components/responses/ServiceError' }
        '404': { $ref: '#/components/responses/ServiceError' }
        '409':
          description: zone_version_conflict или zone_binding_in_progress.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ServiceError' }
    patch:
      tags: [Zones]
      summary: Изменить часть зоны
      description: |
        Меняется только переданное. Требуется текущий revision — иначе
        409 zone_revision_conflict.

        polygon и reference_frame_id передаются только вместе: это перерисовка.
        Она требует текущего кадра камеры, увеличивает version, аннулирует
        привязку и переводит зону в draft; во время сессии привязки —
        409 zone_binding_in_progress.

        name, enabled и rules привязку и version не меняют и допустимы во
        время сессии привязки. rules заменяет список правил целиком; rule_id
        прежнего правила сохраняет его идентификатор.

        Любое изменение увеличивает revision. Тело только с revision ничего
        не меняет и возвращает зону.
      operationId: patchZone
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/AgentId'
        - $ref: '#/components/parameters/CameraId'
        - $ref: '#/components/parameters/ZoneId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ZonePatchRequest' }
      responses:
        '200':
          description: Зона после изменения.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Zone' }
        '401': { $ref: '#/components/responses/ServiceError' }
        '404': { $ref: '#/components/responses/ServiceError' }
        '409':
          description: zone_revision_conflict или zone_binding_in_progress.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: invalid_request, invalid_zone или invalid_reference_frame.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [Zones]
      summary: Удалить зону перед дверью
      operationId: deleteZone
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/AgentId'
        - $ref: '#/components/parameters/CameraId'
        - $ref: '#/components/parameters/ZoneId'
      responses:
        '204': { description: Зона и её незавершённая сессия привязки удалены. }
        '401': { $ref: '#/components/responses/ServiceError' }
        '404': { $ref: '#/components/responses/ServiceError' }

  /api/v1/agents/{agent_id}/cameras/{camera_id}/zones/{zone_id}/binding-sessions:
    post:
      tags: [Zones]
      summary: Запустить серверную привязку зоны перед дверью
      description: |
        Пользователь встаёт на отмеченную площадку пола. Серверный worker
        оценки позы использует свежие кадры, вычисляет опорную точку и проверяет
        её попадание в полигон. Ключевые точки и вычисленная клиентом точка не принимаются.
        У одной зоны может быть не более одной незавершённой сессии.
      operationId: startZoneBindingSession
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/AgentId'
        - $ref: '#/components/parameters/CameraId'
        - $ref: '#/components/parameters/ZoneId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartZoneBindingRequest' }
      responses:
        '201':
          description: Привязка запущена; опрашивайте ресурс сессии.
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ZoneBindingSession' }
        '401': { $ref: '#/components/responses/ServiceError' }
        '404': { $ref: '#/components/responses/ServiceError' }
        '409':
          description: zone_version_conflict, zone_binding_in_progress или zone_already_bound.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: camera_unavailable или invalid_zone.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/agents/{agent_id}/cameras/{camera_id}/zones/{zone_id}/binding-sessions/{binding_session_id}:
    get:
      tags: [Zones]
      summary: Получить ход серверной привязки
      description: |
        Опрос выполняется, пока человек стоит в зоне. last_observation содержит
        маркер для отображения поверх JPEG. Значение in_zone определяет сервер;
        мобильный клиент не должен вычислять его повторно.

        Текст интерфейса определяется state, а не числом наблюдений:
        waiting_for_frame — «Получаем вид с камеры»;
        waiting_for_person — «Встаньте в отмеченное место»;
        collecting — «Проверяем положение…»;
        bound — «Зона проверена».
      operationId: getZoneBindingSession
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/AgentId'
        - $ref: '#/components/parameters/CameraId'
        - $ref: '#/components/parameters/ZoneId'
        - $ref: '#/components/parameters/BindingSessionId'
      responses:
        '200':
          description: Ход привязки или итоговый результат.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ZoneBindingSession' }
        '401': { $ref: '#/components/responses/ServiceError' }
        '404': { $ref: '#/components/responses/ServiceError' }
    delete:
      tags: [Zones]
      summary: Отменить незавершённую сессию привязки
      operationId: cancelZoneBindingSession
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/AgentId'
        - $ref: '#/components/parameters/CameraId'
        - $ref: '#/components/parameters/ZoneId'
        - $ref: '#/components/parameters/BindingSessionId'
      responses:
        '204': { description: Сессия отменена или уже завершена. }
        '401': { $ref: '#/components/responses/ServiceError' }
        '404': { $ref: '#/components/responses/ServiceError' }

  /api/v1/media/{media_id}:
    get:
      tags: [Media]
      summary: Скачать JPEG-кадр камеры
      operationId: downloadMedia
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/MediaId'
      responses:
        '200':
          description: JPEG-кадр домохозяйства.
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/ServiceError' }
        '404': { $ref: '#/components/responses/ServiceError' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  parameters:
    AgentId:
      name: agent_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    CameraId:
      name: camera_id
      in: path
      required: true
      description: Камера из записи агента; сервер проверяет её принадлежность agent_id.
      schema: { type: string, minLength: 1 }
    ZoneId:
      name: zone_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    BindingSessionId:
      name: binding_session_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    MediaId:
      name: media_id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    ServiceError:
      description: Ошибка приложения с постоянным кодом.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Health:
      type: object
      required: [status, checked_at, issues]
      description: |
        Общая готовность наблюдения, включая агентов и камеры.
        Для ok список проблем пуст; для degraded нужна хотя бы одна проблема.
        Возвращаются только полные результаты мониторинга не старше 15 секунд.
      properties:
        status:
          type: string
          enum: [ok, degraded]
        checked_at:
          type: string
          format: date-time
          description: UTC-время завершения последнего полного цикла мониторинга.
        issues:
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/HealthIssue' }
      allOf:
        - if:
            properties:
              status: { const: ok }
          then:
            properties:
              issues: { maxItems: 0 }
        - if:
            properties:
              status: { const: degraded }
          then:
            properties:
              issues: { minItems: 1 }
    HealthIssue:
      type: string
      description: |
        database_unavailable: проверка связи с БД завершилась ошибкой или таймаутом.
        media_storage_unavailable: не удалось записать и прочитать собственный
        проверочный файл в медиахранилище; пользовательские файлы не изменяются.
        processing_unavailable: нет готового worker с загруженными моделями
        и heartbeat готовности не старше 15 секунд. Все worker не запущены,
        загружают модели, не прошли инициализацию, остановлены, аварийно завершились,
        перестали подтверждать готовность или сообщили о невозможности обработки.
        Пустая очередь или ошибка отдельного кадра сами по себе не вызывают эту причину.
        processing_delayed: общее число задач ML в queued и running превышает
        лимит очереди N; причина снимается, когда число задач не больше N.
        Задачи completed и failed исключены; повторные попытки в queued учитываются.
        camera_unavailable: хотя бы у одного зарегистрированного агента нет статуса,
        heartbeat устарел по заданному на сервере сроку либо agent_online,
        camera_connected или stream_active равен false.
      enum:
        - database_unavailable
        - media_storage_unavailable
        - processing_unavailable
        - processing_delayed
        - camera_unavailable

    MobileActivationRequest:
      type: object
      required: [installation_code, device_id, pin]
      properties:
        installation_code: { type: string, minLength: 1 }
        device_id: { type: string, minLength: 1 }
        pin: { type: string, pattern: '^\\d{6}$' }
    MobileLoginRequest:
      type: object
      required: [device_id, pin]
      properties:
        device_id: { type: string, minLength: 1 }
        pin: { type: string, pattern: '^\\d{6}$' }
    MobileToken:
      type: object
      required: [access_token, token_type, household_id]
      properties:
        access_token: { type: string }
        token_type: { type: string, const: bearer }
        household_id: { type: string, format: uuid }

    AgentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Agent' }
    Agent:
      type: object
      required: [agent_id, name, camera_id, online]
      properties:
        agent_id: { type: string, format: uuid }
        name: { type: string }
        camera_id:
          type: string
          description: Передаётся вместе с agent_id в каждом запросе к камере или зоне.
        online: { type: boolean }

    CurrentFrame:
      type: object
      required: [frame_id, media_id, captured_at, width, height]
      properties:
        frame_id: { type: string, format: uuid }
        media_id: { type: string, format: uuid }
        captured_at: { type: string, format: date-time }
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }

    ZonePolygon:
      type: array
      description: |
        Вершины в нормализованных координатах изображения по часовой стрелке
        или против неё. Сервер отклоняет самопересечения и полигон площадью
        менее 0,5% опорного кадра.
      minItems: 3
      maxItems: 12
      items:
        type: array
        minItems: 2
        maxItems: 2
        items: { type: number, minimum: 0, maximum: 1 }
    ZoneRequest:
      type: object
      additionalProperties: false
      required: [name, polygon, reference_frame_id]
      properties:
        name: { type: string, minLength: 1, maxLength: 40 }
        polygon: { $ref: '#/components/schemas/ZonePolygon' }
        reference_frame_id:
          type: string
          format: uuid
          description: Неизменяемый кадр, полученный через current-frame до начала разметки.
        enabled:
          type: boolean
          default: true
          description: Переключатель зоны. Выключенная зона хранится, но тревог не даёт.
        rules:
          type: array
          maxItems: 5
          items: { $ref: '#/components/schemas/ZoneRuleRequest' }
          description: Условия тревоги. Без поля — одно правило «вход, всегда»; пустой список — тревог нет.
    ZonePatchRequest:
      type: object
      additionalProperties: false
      required: [revision]
      properties:
        revision:
          type: integer
          minimum: 1
          description: revision зоны, которую пользователь видит на экране.
        name: { type: string, minLength: 1, maxLength: 40 }
        polygon: { $ref: '#/components/schemas/ZonePolygon' }
        reference_frame_id:
          type: string
          format: uuid
          description: Текущий кадр камеры; только вместе с polygon.
        enabled: { type: boolean }
        rules:
          type: array
          maxItems: 5
          items: { $ref: '#/components/schemas/ZoneRuleRequest' }
      dependentRequired:
        polygon: [reference_frame_id]
        reference_frame_id: [polygon]
    ZoneRuleRequest:
      type: object
      additionalProperties: false
      required: [trigger]
      properties:
        rule_id:
          type: string
          format: uuid
          description: Только в PATCH — сохранить идентификатор существующего правила этой зоны.
        trigger: { $ref: '#/components/schemas/ZoneRuleTrigger' }
        schedule: { $ref: '#/components/schemas/ZoneSchedule' }
    ZoneRule:
      type: object
      required: [rule_id, trigger]
      properties:
        rule_id: { type: string, format: uuid }
        trigger: { $ref: '#/components/schemas/ZoneRuleTrigger' }
        schedule: { $ref: '#/components/schemas/ZoneSchedule' }
    ZoneRuleTrigger:
      type: string
      enum: [enter, exit]
      description: enter — человек вошёл в зону; exit — человек вышел из зоны.
    ZoneSchedule:
      type: object
      additionalProperties: false
      required: [from, to, time_zone]
      description: |
        Ежедневный промежуток, когда правило действует. Нет schedule — правило
        действует всегда. Если to раньше from, промежуток идёт через полночь
        (22:00–07:00 — до 07:00 следующего дня). from входит в промежуток,
        to — нет; from и to не совпадают.
      properties:
        from: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', example: '22:00' }
        to: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', example: '07:00' }
        time_zone:
          type: string
          example: Europe/Moscow
          description: Часовой пояс IANA, в котором заданы from и to.
    ZoneUpdateRequest:
      type: object
      additionalProperties: false
      required: [name, polygon, reference_frame_id, version]
      properties:
        name: { type: string, minLength: 1, maxLength: 40 }
        polygon: { $ref: '#/components/schemas/ZonePolygon' }
        reference_frame_id:
          type: string
          format: uuid
        version: { type: integer, minimum: 1 }
    Zone:
      type: object
      required: [zone_id, agent_id, camera_id, name, polygon, reference_frame_id, reference_media_id, state, version, revision, enabled, rules, created_at, updated_at]
      properties:
        zone_id: { type: string, format: uuid }
        agent_id: { type: string, format: uuid }
        camera_id: { type: string }
        name: { type: string }
        polygon: { $ref: '#/components/schemas/ZonePolygon' }
        reference_frame_id: { type: string, format: uuid }
        reference_media_id: { type: string, format: uuid }
        state:
          type: string
          enum: [draft, binding, bound]
        version:
          type: integer
          minimum: 1
          description: Версия разметки; меняется только при перерисовке. На неё ссылается сессия привязки.
        revision:
          type: integer
          minimum: 1
          description: Номер правки; меняется при любом изменении зоны. Передаётся в PATCH.
        enabled: { type: boolean }
        rules:
          type: array
          items: { $ref: '#/components/schemas/ZoneRule' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ZoneList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Zone' }

    StartZoneBindingRequest:
      type: object
      additionalProperties: false
      required: [zone_version]
      properties:
        zone_version:
          type: integer
          minimum: 1
          description: Версия, которую пользователь только что проверил на экране.
    ZoneBindingSession:
      type: object
      required: [binding_session_id, zone_id, zone_version, state, started_at, expires_at, progress, binding, failure]
      properties:
        binding_session_id: { type: string, format: uuid }
        zone_id: { type: string, format: uuid }
        zone_version: { type: integer, minimum: 1 }
        state:
          type: string
          enum: [waiting_for_frame, waiting_for_person, collecting, bound, failed, expired, cancelled]
          description: |
            Состояние для отображения в интерфейсе. Приложение выбирает
            локализованные текст и иллюстрацию: waiting_for_frame — получение
            изображения; waiting_for_person — просьба встать на отмеченное место;
            collecting — проверка положения; bound — успех. failed,
            expired и cancelled завершают попытку настройки.
        started_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        progress: { $ref: '#/components/schemas/ZoneBindingProgress' }
        binding:
          oneOf:
            - $ref: '#/components/schemas/ZoneBinding'
            - type: 'null'
        failure:
          oneOf:
            - $ref: '#/components/schemas/ZoneBindingFailure'
            - type: 'null'
    ZoneBindingProgress:
      type: object
      required: [accepted_observations, required_observations, last_observation]
      properties:
        accepted_observations:
          type: integer
          minimum: 0
          description: |
            Технический диагностический счётчик. Не показывать пользователю
            как «N из M»; статус интерфейса определяется ZoneBindingSession.state.
        required_observations:
          type: integer
          minimum: 1
          description: Техническая настройка сервера, фиксированная для сессии; не является настройкой приложения.
        last_observation:
          oneOf:
            - $ref: '#/components/schemas/ZoneAnchorObservation'
            - type: 'null'
    ZoneAnchorObservation:
      type: object
      required: [captured_at, frame_id, media_id, point, quality, in_zone]
      properties:
        captured_at: { type: string, format: date-time }
        frame_id: { type: string, format: uuid }
        media_id: { type: string, format: uuid }
        point: { $ref: '#/components/schemas/NormalizedPoint' }
        quality:
          type: string
          enum: [full, degraded]
          description: degraded означает использование допустимого запасного способа.
        in_zone:
          type: boolean
          description: |
            Результат проверки попадания точки в полигон, определённый сервером.
            Пока сессия не завершена, false означает, что интерфейс продолжает
            настройку и просит человека шагнуть в выделенную область;
            это не означает неудачную настройку.
    NormalizedPoint:
      type: object
      required: [x, y]
      properties:
        x: { type: number, minimum: 0, maximum: 1 }
        y: { type: number, minimum: 0, maximum: 1 }
    ZoneBinding:
      type: object
      required: [binding_id, zone_id, zone_version, bound_at, validated_frame_id, accepted_observations, evaluator_version]
      properties:
        binding_id: { type: string, format: uuid }
        zone_id: { type: string, format: uuid }
        zone_version: { type: integer, minimum: 1 }
        bound_at: { type: string, format: date-time }
        validated_frame_id: { type: string, format: uuid }
        accepted_observations: { type: integer, minimum: 1 }
        evaluator_version: { type: string }
    ZoneBindingFailure:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [camera_unavailable, no_person_detected, no_reliable_support_point, insufficient_inside_observations, zone_version_changed]
        message: { type: string }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
